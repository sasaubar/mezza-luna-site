<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Réservations — Admin | La Mezza Luna</title>
<link rel="icon" href="assets/img/logo-red.png" type="image/png" />
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="/assets/fonts/fonts.css" />
<style>
  :root{
    --rouge-vif:#C70039; --vert:#417050; --charbon:#1A1A1A; --charbon-doux:#3a352e;
    --serif:'Cormorant Garamond', Georgia, serif; --sans:'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius:14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:var(--sans); color:var(--charbon); background:#F1F8FD; line-height:1.6; padding:24px; }
  .wrap{ max-width:820px; margin:0 auto; }
  h1{ font-family:var(--serif); font-size:1.8rem; margin-bottom:20px; }

  .pin-ecran{ background:#fff; border-radius:var(--radius); padding:30px; max-width:340px; text-align:center; }
  .pin-ecran input{
    width:100%; padding:13px; border:1.5px solid rgba(26,26,26,.16); border-radius:10px;
    font-size:1.2rem; text-align:center; letter-spacing:.3em; margin-bottom:12px;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    font-weight:600; font-size:.88rem; letter-spacing:.04em; text-transform:uppercase;
    padding:13px 24px; border-radius:50px; cursor:pointer; border:none;
    background:var(--rouge-vif); color:#fff;
  }
  .msg-erreur{ color:var(--rouge-vif); font-size:.88rem; margin-top:10px; }

  #ecranListe{ display:none; }
  .barre-date{ display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
  .barre-date input{ padding:10px 12px; border:1.5px solid rgba(26,26,26,.16); border-radius:8px; font-size:.95rem; }
  .barre-date button{ padding:10px 16px; border-radius:8px; border:1.5px solid rgba(26,26,26,.16); background:#fff; cursor:pointer; font-size:.85rem; }

  .stats{ display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .stat-carte{ background:#fff; border-radius:10px; padding:16px 20px; flex:1; min-width:140px; }
  .stat-carte .valeur{ font-family:var(--serif); font-size:1.9rem; font-weight:700; color:var(--rouge-vif); }
  .stat-carte .label{ font-size:.78rem; color:var(--charbon-doux); text-transform:uppercase; letter-spacing:.06em; }

  table{ width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; }
  th, td{ text-align:left; padding:12px 14px; font-size:.9rem; border-bottom:1px solid rgba(26,26,26,.08); }
  th{ background:#fff; color:var(--charbon-doux); font-size:.76rem; text-transform:uppercase; letter-spacing:.05em; }
  td.annulee{ color:#aaa; text-decoration:line-through; }
  .btn-annuler{
    background:none; border:1.5px solid rgba(199,0,57,.3); color:var(--rouge-vif);
    font-size:.76rem; font-weight:600; padding:6px 12px; border-radius:50px; cursor:pointer;
    text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
  }
  .btn-annuler:hover{ background:var(--rouge-vif); color:#fff; }
  .vide{ padding:30px; text-align:center; color:var(--charbon-doux); background:#fff; border-radius:10px; }

  .section-titre{ font-family:var(--serif); font-size:1.3rem; margin:32px 0 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Réservations</h1>

  <div class="pin-ecran" id="ecranPin">
    <p style="margin-bottom:12px;color:var(--charbon-doux);">Code personnel</p>
    <input type="password" inputmode="numeric" id="champPin" placeholder="••••" />
    <button class="btn" id="btnValiderPin">Valider</button>
    <div class="msg-erreur" id="msgErreurPin" style="display:none;"></div>
  </div>

  <div id="ecranListe">
    <div class="barre-date">
      <input type="date" id="champDate" />
      <button id="btnAujourdhui">Aujourd'hui</button>
    </div>
    <div class="stats">
      <div class="stat-carte"><div class="valeur" id="statDejeuner">0</div><div class="label">Couverts déjeuner</div></div>
      <div class="stat-carte"><div class="valeur" id="statDiner">0</div><div class="label">Couverts dîner</div></div>
      <div class="stat-carte"><div class="valeur" id="statTotal">0</div><div class="label">Réservations actives</div></div>
    </div>
    <div id="tableContainer"></div>

    <h2 class="section-titre">Réservations à venir</h2>
    <div id="tableContainerAVenir"></div>
  </div>
</div>

<script>
  var API_BASE = 'https://api.lamezzalunaclamart.com/api';
  var PIN_STORAGE_KEY = 'fidelite-staff-pin';
  var champDate = document.getElementById('champDate');

  var aujourdHui = new Date().toISOString().slice(0, 10);
  champDate.value = aujourdHui;

  document.getElementById('btnValiderPin').addEventListener('click', function () {
    var pin = document.getElementById('champPin').value.trim();
    if (!pin) return;
    sessionStorage.setItem(PIN_STORAGE_KEY, pin);
    chargerJour();
  });

  document.getElementById('btnAujourdhui').addEventListener('click', function () {
    champDate.value = aujourdHui;
    chargerJour();
  });
  champDate.addEventListener('change', chargerJour);

  var pinDejaEnregistre = sessionStorage.getItem(PIN_STORAGE_KEY);
  if (pinDejaEnregistre) { chargerJour(); }

  function chargerJour() {
    var pin = sessionStorage.getItem(PIN_STORAGE_KEY) || '';
    fetch(API_BASE + '/reservation?action=liste&date=' + champDate.value + '&pin=' + encodeURIComponent(pin))
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          sessionStorage.removeItem(PIN_STORAGE_KEY);
          document.getElementById('msgErreurPin').textContent = res.data && res.data.error ? res.data.error : 'Erreur';
          document.getElementById('msgErreurPin').style.display = 'block';
          return;
        }
        afficherListe(res.data.reservations);
        chargerAVenir();
      });
  }

  function chargerAVenir() {
    var pin = sessionStorage.getItem(PIN_STORAGE_KEY) || '';
    fetch(API_BASE + '/reservation?action=aVenir&pin=' + encodeURIComponent(pin))
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) return;
        afficherListeAVenir(res.data.reservations);
      });
  }

  function afficherListeAVenir(reservations) {
    var container = document.getElementById('tableContainerAVenir');
    if (reservations.length === 0) {
      container.innerHTML = '<div class="vide">Aucune réservation à venir.</div>';
      return;
    }

    var lignes = reservations.map(function (r) {
      var nomService = r.service === 'dejeuner' ? 'Déjeuner' : 'Dîner';
      var dateAffichee = new Date(r.date + 'T12:00:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
      return '<tr>' +
        '<td>' + dateAffichee + '</td>' +
        '<td>' + r.heure + '</td>' +
        '<td>' + nomService + '</td>' +
        '<td>' + escapeHtml(r.nom) + '</td>' +
        '<td>' + escapeHtml(r.telephone) + '</td>' +
        '<td>' + r.couverts + '</td>' +
        '<td>' + escapeHtml(r.note || '—') + '</td>' +
        '<td><button class="btn-annuler" data-id="' + r.id + '" data-nom="' + escapeHtml(r.nom) + '">Annuler</button></td>' +
        '</tr>';
    }).join('');

    container.innerHTML = '<table><thead><tr>' +
      '<th>Date</th><th>Heure</th><th>Service</th><th>Nom</th><th>Téléphone</th><th>Couverts</th><th>Note</th><th></th>' +
      '</tr></thead><tbody>' + lignes + '</tbody></table>';

    container.querySelectorAll('.btn-annuler').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var nom = btn.getAttribute('data-nom');
        if (!confirm('Annuler la réservation de ' + nom + ' ?')) return;
        annulerReservation(id);
      });
    });
  }

  function afficherListe(reservations) {
    document.getElementById('ecranPin').style.display = 'none';
    document.getElementById('ecranListe').style.display = 'block';

    var actives = reservations.filter(function (r) { return r.statut !== 'annulee'; });
    var couvertsDejeuner = actives.filter(function (r) { return r.service === 'dejeuner'; }).reduce(function (s, r) { return s + r.couverts; }, 0);
    var couvertsDiner = actives.filter(function (r) { return r.service === 'diner'; }).reduce(function (s, r) { return s + r.couverts; }, 0);
    document.getElementById('statDejeuner').textContent = couvertsDejeuner;
    document.getElementById('statDiner').textContent = couvertsDiner;
    document.getElementById('statTotal').textContent = actives.length;

    var container = document.getElementById('tableContainer');
    if (reservations.length === 0) {
      container.innerHTML = '<div class="vide">Aucune réservation ce jour-là.</div>';
      return;
    }

    var lignes = reservations.map(function (r) {
      var annulee = r.statut === 'annulee';
      var nomService = r.service === 'dejeuner' ? 'Déjeuner' : 'Dîner';
      return '<tr>' +
        '<td class="' + (annulee ? 'annulee' : '') + '">' + r.heure + '</td>' +
        '<td class="' + (annulee ? 'annulee' : '') + '">' + nomService + '</td>' +
        '<td class="' + (annulee ? 'annulee' : '') + '">' + escapeHtml(r.nom) + '</td>' +
        '<td class="' + (annulee ? 'annulee' : '') + '">' + escapeHtml(r.telephone) + '</td>' +
        '<td class="' + (annulee ? 'annulee' : '') + '">' + r.couverts + '</td>' +
        '<td class="' + (annulee ? 'annulee' : '') + '">' + escapeHtml(r.note || '—') + '</td>' +
        '<td>' + (annulee ? 'Annulée' : '<button class="btn-annuler" data-id="' + r.id + '" data-nom="' + escapeHtml(r.nom) + '">Annuler</button>') + '</td>' +
        '</tr>';
    }).join('');

    container.innerHTML = '<table><thead><tr>' +
      '<th>Heure</th><th>Service</th><th>Nom</th><th>Téléphone</th><th>Couverts</th><th>Note</th><th></th>' +
      '</tr></thead><tbody>' + lignes + '</tbody></table>';

    document.querySelectorAll('.btn-annuler').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        var nom = btn.getAttribute('data-nom');
        if (!confirm('Annuler la réservation de ' + nom + ' ?')) return;
        annulerReservation(id);
      });
    });
  }

  function annulerReservation(id) {
    var pin = sessionStorage.getItem(PIN_STORAGE_KEY) || '';
    fetch(API_BASE + '/reservation?action=annuler', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Staff-Pin': pin },
      body: JSON.stringify({ id: id }),
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          alert(res.data && res.data.error ? res.data.error : 'Erreur lors de l\'annulation');
          return;
        }
        chargerJour();
      })
      .catch(function () {
        alert('Erreur réseau lors de l\'annulation');
      });
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
