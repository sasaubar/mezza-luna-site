<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scanner fidélité | La Mezza Luna</title>
<link rel="icon" href="assets/img/logo-red.png" type="image/png" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --rouge-vif:#C70039;
    --rouge-profond:#900C27;
    --vert:#417050;
    --charbon:#1A1A1A;
    --charbon-doux:#3a352e;
    --serif:'Cormorant Garamond', Georgia, serif;
    --sans:'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    --radius:14px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    font-family:var(--sans); color:var(--charbon); background:#111; line-height:1.6;
    min-height:100vh; padding:20px; -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:460px; margin:0 auto; }
  h1{ font-family:var(--serif); color:#fff; font-size:1.5rem; text-align:center; margin-bottom:16px; }

  /* Écran PIN */
  .pin-ecran{ background:#fff; border-radius:var(--radius); padding:32px; text-align:center; }
  .pin-ecran input{
    width:100%; padding:14px; border:1.5px solid rgba(26,26,26,.16); border-radius:10px;
    font-size:1.3rem; text-align:center; letter-spacing:.3em; margin-bottom:14px;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; width:100%;
    font-weight:600; font-size:.92rem; letter-spacing:.04em; text-transform:uppercase;
    padding:15px 30px; border-radius:50px; cursor:pointer; border:none;
    background:var(--rouge-vif); color:#fff; transition:background .18s ease;
  }
  .btn:hover{ background:var(--rouge-profond); }
  .btn-vert{ background:var(--vert); }
  .btn-ghost{ background:transparent; color:var(--charbon-doux); border:1.5px solid rgba(26,26,26,.2); margin-top:10px; }

  /* Écran scanner */
  #ecranScanner{ display:none; }
  #lecteur{ border-radius:var(--radius); overflow:hidden; margin-bottom:16px; }
  .statut-scan{ color:#fff; text-align:center; font-size:.9rem; opacity:.7; margin-bottom:16px; }

  /* Carte résultat */
  .resultat{
    background:#fff; border-radius:var(--radius); padding:26px; text-align:center;
    display:none; margin-bottom:16px;
  }
  .resultat h2{ font-family:var(--serif); font-size:1.5rem; margin-bottom:6px; }
  .resultat .compte{ font-size:1.1rem; color:var(--charbon-doux); margin-bottom:18px; }
  .resultat .compte strong{ color:var(--rouge-vif); }
  .resultat .actions{ display:flex; flex-direction:column; gap:10px; }
  .badge-pret{
    display:inline-block; background:var(--vert); color:#fff; font-size:.8rem; font-weight:600;
    padding:6px 14px; border-radius:50px; margin-bottom:14px;
  }
  .msg-erreur{ color:var(--rouge-vif); text-align:center; font-size:.9rem; margin-bottom:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fidélité — Scanner</h1>

  <div class="pin-ecran" id="ecranPin">
    <p style="margin-bottom:14px;color:var(--charbon-doux);">Code personnel</p>
    <input type="password" inputmode="numeric" id="champPin" placeholder="••••" />
    <button class="btn" id="btnValiderPin">Valider</button>
    <div class="msg-erreur" id="msgErreurPin" style="display:none;margin-top:12px;"></div>
  </div>

  <div id="ecranScanner">
    <div id="lecteur"></div>
    <p class="statut-scan" id="statutScan">Visez le QR code du client</p>
    <p style="text-align:center;margin-bottom:16px;">
      <a href="#" id="lienRecherche" style="color:#fff;font-size:.82rem;text-decoration:underline;opacity:.8;">Pas de QR ? Chercher par téléphone</a>
    </p>
    <div class="pin-ecran" id="blocRecherche" style="display:none;margin-bottom:16px;">
      <input type="tel" id="champTelephone" placeholder="06 XX XX XX XX" style="letter-spacing:normal;text-align:left;font-size:1rem;" />
      <button class="btn" id="btnChercher">Chercher</button>
    </div>

    <div class="resultat" id="resultat">
      <span class="badge-pret" id="badgePret" style="display:none;">Récompense disponible</span>
      <h2 id="resultatNom"></h2>
      <div class="compte" id="resultatCompte"></div>
      <div class="msg-erreur" id="resultatErreur" style="display:none;"></div>
      <div class="actions">
        <button class="btn" id="btnTampon">Ajouter un tampon</button>
        <button class="btn btn-vert" id="btnEchanger" style="display:none;">Échanger la récompense</button>
        <button class="btn btn-ghost" id="btnAnnuler">Reprendre le scan</button>
      </div>
    </div>
  </div>
</div>

<script>
  var API_BASE = 'https://api.lamezzalunaclamart.com/api';
  var PIN_STORAGE_KEY = 'fidelite-staff-pin';

  var ecranPin = document.getElementById('ecranPin');
  var ecranScanner = document.getElementById('ecranScanner');
  var champPin = document.getElementById('champPin');
  var msgErreurPin = document.getElementById('msgErreurPin');
  var resultat = document.getElementById('resultat');
  var statutScan = document.getElementById('statutScan');
  var html5QrCode = null;
  var idScanne = null;

  document.getElementById('btnValiderPin').addEventListener('click', function(){
    var pin = champPin.value.trim();
    if(!pin){ return; }
    sessionStorage.setItem(PIN_STORAGE_KEY, pin);
    demarrerScanner();
  });

  var pinDejaEnregistre = sessionStorage.getItem(PIN_STORAGE_KEY);
  if(pinDejaEnregistre){ demarrerScanner(); }

  function demarrerScanner(){
    ecranPin.style.display = 'none';
    ecranScanner.style.display = 'block';
    html5QrCode = new Html5Qrcode('lecteur');

    // On liste d'abord les caméras (ça déclenche proprement la demande de permission
    // sur iOS Safari) puis on démarre avec l'id de la caméra arrière plutôt qu'avec
    // la contrainte facingMode, peu fiable sur Safari.
    Html5Qrcode.getCameras().then(function(cameras){
      if(!cameras || cameras.length === 0){
        statutScan.textContent = 'Aucune caméra détectée sur cet appareil.';
        return;
      }
      var arriere = cameras.find(function(c){ return /back|arri[eè]re|rear|environment/i.test(c.label || ''); });
      var camera = arriere || cameras[cameras.length - 1];
      lancerFlux(camera.id);
    }).catch(function(err){
      // Repli sur l'ancienne méthode si getCameras() échoue (certains navigateurs
      // n'autorisent pas l'énumération mais acceptent quand même facingMode).
      lancerFlux({ facingMode: 'environment' });
    });
  }

  function lancerFlux(cible){
    html5QrCode.start(
      cible,
      { fps: 10, qrbox: 240 },
      onScanReussi,
      function(){}
    ).catch(function(err){
      statutScan.textContent = 'Impossible d\'ouvrir la caméra : ' + err;
    });
  }

  function onScanReussi(texteDecode){
    if(idScanne) return; // évite les doubles scans
    idScanne = texteDecode;
    html5QrCode.pause(true);
    chargerCarte(idScanne);
  }

  document.getElementById('lienRecherche').addEventListener('click', function(e){
    e.preventDefault();
    var bloc = document.getElementById('blocRecherche');
    bloc.style.display = bloc.style.display === 'none' ? 'block' : 'none';
  });

  document.getElementById('btnChercher').addEventListener('click', function(){
    var telephone = document.getElementById('champTelephone').value.trim();
    if(!telephone) return;
    var pin = sessionStorage.getItem(PIN_STORAGE_KEY) || '';
    resultat.style.display = 'none';
    document.getElementById('resultatErreur').style.display = 'none';
    fetch(API_BASE + '/fidelite-recherche?telephone=' + encodeURIComponent(telephone) + '&pin=' + encodeURIComponent(pin))
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if(!res.ok){ throw new Error(res.data && res.data.error ? res.data.error : 'Aucune carte trouvée'); }
        idScanne = res.data.id;
        if(html5QrCode){ html5QrCode.pause(true); }
        afficherResultat(res.data);
      })
      .catch(function(err){
        afficherErreurCarte(err.message);
      });
  });

  function chargerCarte(id){
    resultat.style.display = 'none';
    document.getElementById('resultatErreur').style.display = 'none';
    fetch(API_BASE + '/fidelite-carte?id=' + encodeURIComponent(id))
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if(!res.ok){ throw new Error(res.data && res.data.error ? res.data.error : 'Carte introuvable'); }
        afficherResultat(res.data);
      })
      .catch(function(err){
        afficherErreurCarte(err.message);
      });
  }

  function afficherResultat(data){
    resultat.style.display = 'block';
    document.getElementById('resultatNom').textContent = data.nom;
    document.getElementById('resultatCompte').innerHTML = '<strong>' + data.tampons + ' / ' + data.objectif + '</strong> tampons';
    var pret = data.tampons >= data.objectif;
    document.getElementById('badgePret').style.display = pret ? 'inline-block' : 'none';
    document.getElementById('btnEchanger').style.display = pret ? 'block' : 'none';
    document.getElementById('btnTampon').style.display = pret ? 'none' : 'block';
  }

  function afficherErreurCarte(message){
    resultat.style.display = 'block';
    document.getElementById('resultatNom').textContent = 'Carte introuvable';
    document.getElementById('resultatCompte').textContent = '';
    document.getElementById('badgePret').style.display = 'none';
    document.getElementById('btnEchanger').style.display = 'none';
    document.getElementById('btnTampon').style.display = 'none';
    var err = document.getElementById('resultatErreur');
    err.textContent = message || 'Erreur';
    err.style.display = 'block';
  }

  document.getElementById('btnTampon').addEventListener('click', function(){
    appelStaff('/fidelite-tampon', afficherResultat);
  });
  document.getElementById('btnEchanger').addEventListener('click', function(){
    appelStaff('/fidelite-echanger', function(data){
      afficherResultat({ nom: data.nom, tampons: data.tampons, objectif: 8 });
    });
  });
  document.getElementById('btnAnnuler').addEventListener('click', reprendreLeScan);

  function appelStaff(chemin, onSucces){
    var pin = sessionStorage.getItem(PIN_STORAGE_KEY) || '';
    fetch(API_BASE + chemin, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Staff-Pin': pin },
      body: JSON.stringify({ id: idScanne }),
    })
      .then(function(r){ return r.json().then(function(data){ return { ok: r.ok, data: data }; }); })
      .then(function(res){
        if(!res.ok){
          if(res.data && res.data.error === 'Code personnel invalide'){
            sessionStorage.removeItem(PIN_STORAGE_KEY);
            alert('Code personnel incorrect, merci de le ressaisir.');
            location.reload();
            return;
          }
          throw new Error(res.data && res.data.error ? res.data.error : 'Erreur');
        }
        onSucces(res.data);
      })
      .catch(function(err){
        afficherErreurCarte(err.message);
      });
  }

  function reprendreLeScan(){
    idScanne = null;
    resultat.style.display = 'none';
    html5QrCode.resume();
  }
</script>

</body>
</html>
